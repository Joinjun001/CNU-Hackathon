name: word402
version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: word402-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppassword
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - word402-network

  wordpress:
    image: wordpress:latest
    container_name: word402-wordpress
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppassword
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') {
            $$_SERVER['HTTPS'] = 'on';
        }
        if (isset($$_SERVER['HTTP_HOST'])) {
            $$scheme = (isset($$_SERVER['HTTPS']) && $$_SERVER['HTTPS'] === 'on') ? 'https://' : 'http://';
            define('WP_HOME', $$scheme . $$_SERVER['HTTP_HOST']);
            define('WP_SITEURL', $$scheme . $$_SERVER['HTTP_HOST']);
        }
    volumes:
      - wp_data:/var/www/html
      - ./word402:/var/www/html/wp-content/plugins/word402
    networks:
      - word402-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: word402-cloudflared
    restart: always
    depends_on:
      - wordpress
    networks:
      - word402-network
    command: tunnel --no-autoupdate --url http://wordpress:80

volumes:
  db_data:
  wp_data:

networks:
  word402-network:
    driver: bridge
